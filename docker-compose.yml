# AI 聊天网站 —— 多容器编排
# 启动： docker compose up -d --build
# 停止： docker compose down
# 说明： 所有敏感配置通过同目录 .env 文件注入（参考 .env.example 复制后修改）

services:
  # ---------------- 数据库 ----------------
  db:
    image: postgres:16-alpine
    container_name: aido-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aido_password}
      POSTGRES_DB: ${POSTGRES_DB:-aido}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 仅在数据卷首次初始化时自动执行建表脚本
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # 绑定回环地址，避免数据库直接暴露到局域网；不需要外部调试可删除此段
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aido} -d ${POSTGRES_DB:-aido}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aido-net

  # ---------------- 后端 API ----------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aido-backend:latest
    container_name: aido-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内连接信息覆盖 .env，保证容器网络互通
      DATABASE_URL: postgres://${POSTGRES_USER:-aido}:${POSTGRES_PASSWORD:-aido_password}@db:5432/${POSTGRES_DB:-aido}
      NODE_ENV: production
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 仅绑定本机，外部流量统一由前端 nginx 代理；生产环境可去掉此映射
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aido-net

  # ---------------- 前端（nginx 静态托管 + /api 反向代理） ----------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: aido-frontend:latest
    container_name: aido-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - aido-net

volumes:
  pgdata:
    driver: local

networks:
  aido-net:
    driver: bridge
